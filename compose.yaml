services:
  kairc:
    build: .
    restart: unless-stopped
    init: true
    # The IRC gateway deliberately binds host loopback. Host networking keeps
    # that trust boundary intact; this compose file therefore targets Linux.
    network_mode: host
    read_only: true
    volumes:
      - ./config/kairc.conf.example:/etc/kairc/kairc.conf:ro
      - kairc-data:/var/lib/kairc/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  kairc-data:
