services:
  kairc:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - "6667:6667"
      - "127.0.0.1:8080:8080"
    environment:
      KAIRC_SERVER_NAME: irc.example.org
      KAIRC_NETWORK: KairoteNet
      KAIRC_MOTD: Welcome to Kairc.
      KAIRC_MAX_CLIENTS: "1024"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
